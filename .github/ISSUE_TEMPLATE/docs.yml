name: 📚 Documentation Update
description: Suggest improvements or corrections for a specific page
title: '[Docs]: '
labels: [documentation]

body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve the documentation!

  - type: input
    id: location
    attributes:
      label: Page / Section
      description: Where in the documentation did you notice the issue?
      placeholder: e.g., Getting Started > Docker, Services > S3
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: Description of the Issue
      description: What's wrong, missing, or unclear?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Improvement
      description: How would you improve it?

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to avoid duplicates.
        - label: I have described the issue and suggestion clearly.
