name: 🌟 Feature Request
description: Suggest new content, pages, or improvements to the documentation site
title: '[Feature]: '
labels: [enhancement]

body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to suggest an improvement!

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this address?
      placeholder: e.g., There is no guide for configuring the SDK in Python.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe what you'd like to see added or changed.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches you've considered?

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to make sure this is not a duplicate.
        - label: I have described the problem and the proposed solution clearly.
